<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全商英語検定試験問題集 解答｜書き方 語形変化</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
  body { font-family:'Noto Sans JP', sans-serif; }
  .en { font-family:'Georgia','Times New Roman',serif; }
  .qcard { transition: box-shadow .15s ease; }
  .opt { transition: background .15s ease, border-color .15s ease, color .15s ease; }
  .reveal { display:none; }
  .reveal.show { display:block; }
</style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

<header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
  <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
    <div>
      <p class="text-xs sm:text-sm font-bold text-indigo-500">🎓 全商英語検定試験問題集 解答（書き方）</p>
      <h1 class="text-xl sm:text-2xl font-black">🔤 語形変化 <span class="text-slate-400 font-bold text-base">答え合わせ</span></h1>
      <p class="text-xs text-slate-400 mt-0.5">（　）に入る形を①②③から予想 → カードをタップすると正解が緑に光ります</p>
    </div>
    <div class="flex gap-2 shrink-0">
      <button onclick="toggleAll(true)"  class="bg-blue-500 hover:bg-blue-600 text-white text-xs sm:text-sm font-bold px-3 py-2 rounded-xl">全部表示</button>
      <button onclick="toggleAll(false)" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs sm:text-sm font-bold px-3 py-2 rounded-xl">全部隠す</button>
    </div>
  </div>
  <div class="max-w-4xl mx-auto px-4 pb-3 flex gap-1 overflow-x-auto" id="tabbar"></div>
</header>

<main class="max-w-4xl mx-auto px-4 py-6" id="main"></main>

<footer class="text-center text-xs text-slate-400 py-6 px-4 leading-relaxed">
  英文の（　）に入る、もっとも適当な語（形）を①〜③から選ぶ問題です。緑＝正解。<br>
  ＝全商英語検定試験問題集（3級）Part 3 Writing 実践演習 p.52〜53／語形変化 準拠＝
</footer>

<script>
// pre＝（　）の前 / opts=[①,②,③] / post＝（　）の後 / a=正解番号 / r=ポイント
const SETS = [
  { title:'大問1', kai:'', items:[
    { pre:"This library was", opts:["make","made","making"], post:"fifteen years ago.", a:2, r:"was made ＝ 建てられた（受動態）" },
    { pre:"They decided", opts:["discuss","discussing","to discuss"], post:"the matter.", a:3, r:"decide to do ＝ ～することに決める" },
    { pre:"Her mother let her", opts:["go","went","to go"], post:"to the party.", a:1, r:"let ＋ O ＋ 動詞の原形 ＝ O に～させる" },
    { pre:"A: Who beat you?　B: John", opts:["does","did","do"], post:".", a:2, r:"beat は過去の話 → did（過去形の代動詞）" },
    { pre:"I want you", opts:["coming","to come","come"], post:"with me.", a:2, r:"want 人 to do ＝ 人に～してほしい" },
  ]},
  { title:'大問2', kai:'', items:[
    { pre:"My sister", opts:["reads","read","was reading"], post:"a book when I entered the room.", a:3, r:"was reading ＝ ～していた（過去進行形）" },
    { pre:"Did you enjoy", opts:["to play","play","playing"], post:"baseball with them?", a:3, r:"enjoy doing ＝ ～するのを楽しむ" },
    { pre:"We were happy", opts:["hear","to hear","heard"], post:"the news.", a:2, r:"be happy to do ＝ ～してうれしい" },
    { pre:"I showed her a letter", opts:["send","sending","sent"], post:"to me by Tom.", a:3, r:"a letter sent to me ＝ 私に送られた手紙（過去分詞）" },
    { pre:"This is", opts:["exciting","more exciting","the most exciting"], post:"movie that I have ever seen.", a:3, r:"the most exciting … that I have ever seen ＝ 今まで見た中で最も～（最上級）" },
  ]},
  { title:'大問3', kai:'', items:[
    { pre:"I met your sister yesterday. Do you live with", opts:["she","her","hers"], post:"?", a:2, r:"前置詞の後ろは目的格 → her" },
    { pre:"She is often", opts:["mistake","mistook","mistaken"], post:"for her sister.", a:3, r:"be mistaken for ～ ＝ ～と間違えられる（受動態）" },
    { pre:"My favorite thing is", opts:["watch","watched","watching"], post:"movies.", a:3, r:"補語になる動名詞 watching ＝ 見ること" },
    { pre:"This ceiling is not as", opts:["low","lower","lowest"], post:"as the old one.", a:1, r:"as ～ as … ＝ 原級（low のまま）" },
    { pre:"I have", opts:["visit","visited","visiting"], post:"Kyoto three times.", a:2, r:"have ＋ 過去分詞 visited ＝ ～したことがある（経験）" },
  ]},
  { title:'大問4', kai:'第62回', items:[
    { pre:"Ken told", opts:["we","our","us"], post:"that he bought new shoes.", a:3, r:"tell の目的語は目的格 → us" },
    { pre:"Both Jack and I", opts:["is","am","are"], post:"in the same class.", a:3, r:"Both A and B は複数扱い → are" },
    { pre:"My brother wrote the report with", opts:["surprise","surprising","surprised"], post:"speed.", a:2, r:"surprising speed ＝ 驚くほどの速さ" },
    { pre:"", opts:["Get","Got","Getting"], post:"up early in the morning is good for your health.", a:3, r:"動名詞の主語 Getting up ＝ 早起きすること" },
    { pre:"He", opts:["starts","started","will start"], post:"to read the book an hour ago.", a:2, r:"an hour ago（1時間前）→ 過去形 started" },
  ]},
  { title:'大問5', kai:'第66回', items:[
    { pre:"I met Mary yesterday. She was with", opts:["she","her","hers"], post:"father.", a:2, r:"所有格 her ＝ 彼女の（father を修飾）" },
    { pre:"I want to visit Canada when I", opts:["grow","grew","grown"], post:"up.", a:1, r:"時を表す文では未来のことも現在形 → grow up" },
    { pre:"Did you and Tom go", opts:["shop","shopped","shopping"], post:"in Tokyo yesterday?", a:3, r:"go shopping ＝ 買い物に行く（go ～ing）" },
    { pre:"A: Is your father", opts:["wash","washed","washing"], post:"the dishes in the kitchen?　B: Yes, he is.", a:3, r:"is washing ＝ 洗っている（現在進行形）" },
    { pre:"This book is as", opts:["interest","interested","interesting"], post:"as that book.", a:3, r:"as interesting as … ＝ 原級（物の様子は -ing）" },
  ]},
  { title:'大問6', kai:'第68回', items:[
    { pre:"I want to be a good friend of", opts:["you","your","yours"], post:".", a:3, r:"a good friend of yours ＝ あなたの友達（of のあとは所有代名詞）" },
    { pre:"We", opts:["sing","sang","singing"], post:"that song in music class yesterday.", a:2, r:"yesterday（過去）→ sang" },
    { pre:"A: How long will you be", opts:["stay","stayed","staying"], post:"at this hotel?　B: For two weeks.", a:3, r:"will be ～ing ＝ ～することになっている（未来の予定）" },
    { pre:"I like summer", opts:["well","better","best"], post:"than winter.", a:2, r:"better than … ＝ …より好き（比較級）" },
    { pre:"My sister bought a", opts:["use","used","using"], post:"car this month.", a:2, r:"used car ＝ 中古車（過去分詞）" },
  ]},
  { title:'大問7', kai:'第70回', items:[
    { pre:"I have three brothers.", opts:["They","Their","Them"], post:"all live in America.", a:1, r:"主語になる主格 They ＝ 彼らは" },
    { pre:"I", opts:["wake","woke","woken"], post:"up about an hour ago.", a:2, r:"an hour ago（過去）→ woke up" },
    { pre:"Soccer is an", opts:["excite","exciting","excited"], post:"sport.", a:2, r:"exciting sport ＝ わくわくさせるスポーツ（物を説明）" },
    { pre:"This is the", opts:["short","shorter","shortest"], post:"of the three ways.", a:3, r:"the ～est of the three ＝ 3つの中で最も～（最上級）" },
    { pre:"When did you", opts:["open","opened","opening"], post:"your new restaurant?", a:1, r:"did you ＋ 動詞の原形 open" },
  ]},
  { title:'大問8', kai:'第60回', items:[
    { pre:"A friend of", opts:["my","me","mine"], post:"helped me with my homework.", a:3, r:"a friend of mine ＝ 私の友達（of のあとは所有代名詞）" },
    { pre:"How many people", opts:["be","is","are"], post:"there in your office?", a:3, r:"people（複数）→ are there" },
    { pre:"You shouldn't", opts:["eat","ate","eating"], post:"in the library.", a:1, r:"should ＋ 動詞の原形 eat" },
    { pre:"A: Which is the", opts:["short","shorter","shortest"], post:"month of the year?　B: February is.", a:3, r:"最上級 shortest ＝ 最も短い" },
    { pre:"You went shopping yesterday,", opts:["don't","doesn't","didn't"], post:"you?", a:3, r:"過去の付加疑問 → didn't you?" },
  ]},
];

const CIRC = ['','①','②','③','④'];
const AB   = ['a','b','c','d','e','f','g'];
let cur = 0;

const TAB_ON  = 'border-blue-500 text-blue-700 bg-blue-50';
const TAB_OFF = 'border-transparent text-slate-500 bg-white hover:text-slate-700';
function renderTabs(){
  document.getElementById('tabbar').innerHTML = SETS.map((s,i)=>
    `<button onclick="switchTab(${i})" id="tab-${i}"
       class="tabbtn shrink-0 px-4 py-2 text-sm font-bold rounded-t-xl border-b-2 ${i===cur?TAB_ON:TAB_OFF}">
       ${s.title}</button>`).join('');
}
function switchTab(i){ cur=i; renderTabs(); renderMain(); }

function renderMain(){
  const s = SETS[cur];
  document.getElementById('main').innerHTML = `
    <div class="flex items-center gap-2 mb-4">
      <span class="bg-indigo-600 text-white px-3 py-1 rounded-lg font-black text-sm">${s.title}</span>
      ${s.kai?`<span class="en text-xs font-bold text-slate-400">(${s.kai})</span>`:''}
    </div>
    <div class="space-y-3">
      ${s.items.map((it,ii)=>{
        const id = `${cur}-${ii}`;
        const opts = it.opts.map((o,oi)=>{
          const n = oi+1;
          return `<span class="opt inline-block rounded-md border border-transparent px-1.5 py-0.5" id="opt-${id}-${n}">
                    <span class="font-black text-slate-400">${CIRC[n]}</span>
                    <span class="en">${o}</span></span>`;
        }).join(' ');
        return `
        <div class="qcard bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
          <button onclick="toggle('${id}')" class="w-full text-left px-4 py-3 hover:bg-slate-50">
            <div class="flex items-start gap-3">
              <span class="text-slate-400 font-black text-sm mt-1 w-4 shrink-0">${AB[ii]}.</span>
              <p class="flex-1 text-base sm:text-lg leading-relaxed">
                <span class="en">${it.pre}</span>
                <span class="text-slate-400">（</span>${opts}<span class="text-slate-400">）</span>
                <span class="en">${it.post}</span>
              </p>
              <span class="text-slate-300 text-xs mt-1 shrink-0" id="hint-${id}">タップで正解 ▾</span>
            </div>
          </button>
          <div class="reveal px-4 pb-3 pl-11" id="rev-${id}">
            <div class="bg-emerald-50 border border-emerald-100 rounded-lg px-3 py-2 text-sm flex items-start gap-2">
              <span class="font-black text-emerald-600 shrink-0">答え ${CIRC[it.a]} <span class="en">${it.opts[it.a-1]}</span></span>
              <span class="text-slate-600 mt-0.5">${it.r}</span>
            </div>
          </div>`;
      }).join('')}
    </div>`;
}

function setRevealed(id, on){
  const it = SETS[+id.split('-')[0]].items[+id.split('-')[1]];
  document.getElementById(`rev-${id}`).classList.toggle('show', on);
  const h = document.getElementById(`hint-${id}`);
  if(h) h.style.visibility = on ? 'hidden' : 'visible';
  const opt = document.getElementById(`opt-${id}-${it.a}`);
  if(opt){
    opt.classList.toggle('bg-emerald-100', on);
    opt.classList.toggle('border-emerald-300', on);
    opt.classList.toggle('font-black', on);
  }
}
function toggle(id){
  const on = !document.getElementById(`rev-${id}`).classList.contains('show');
  setRevealed(id, on);
}
function toggleAll(on){
  document.querySelectorAll('.reveal').forEach(r=> setRevealed(r.id.replace('rev-',''), on));
}

renderTabs();
renderMain();
</script>
</body>
</html>
