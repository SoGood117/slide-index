<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全商英語検定試験問題集 解答｜文の区切り・強勢</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
  body { font-family:'Noto Sans JP', sans-serif; }
  .en { font-family:'Georgia','Times New Roman',serif; }
  .qcard { transition: box-shadow .15s ease; }
  /* 区切り */
  .brk { color:#cbd5e1; font-weight:700; padding:0 .15em; }
  .brk .num { display:inline-block; font-size:.6em; vertical-align:.4em; color:#94a3b8; }
  .brk.hit { color:#dc2626; }
  .brk.hit .slash { font-size:1.4em; }
  .brk.hit .num { color:#dc2626; font-weight:900; }
  /* 強勢 */
  .choice { border-bottom:2px solid #94a3b8; padding-bottom:1px; position:relative; }
  .choice .num { display:inline-block; font-size:.6em; vertical-align:.4em; color:#94a3b8; margin-left:.1em; }
  .choice.hit { background:#fde68a; border-bottom-color:#d97706; font-weight:900; border-radius:4px; padding:1px 4px; }
  .choice.hit .num { color:#b45309; font-weight:900; }
  .reveal { display:none; }
  .reveal.show { display:block; }
</style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

<header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
  <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
    <div>
      <p class="text-xs sm:text-sm font-bold text-indigo-500">🎓 全商英語検定試験問題集 解答</p>
      <h1 class="text-xl sm:text-2xl font-black">🔊 文の区切り・強勢 <span class="text-slate-400 font-bold text-base">答え合わせ</span></h1>
      <p class="text-xs text-slate-400 mt-0.5">問題をクリック（タップ）すると答えが出ます</p>
    </div>
    <div class="flex gap-2">
      <button onclick="toggleAll(true)"  class="bg-blue-500 hover:bg-blue-600 text-white text-xs sm:text-sm font-bold px-3 py-2 rounded-xl">全部表示</button>
      <button onclick="toggleAll(false)" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs sm:text-sm font-bold px-3 py-2 rounded-xl">全部隠す</button>
    </div>
  </div>
  <div class="max-w-4xl mx-auto px-4 pb-3 flex gap-1">
    <button onclick="switchTab('k')" id="tab-k" class="tabbtn px-5 py-2 text-sm font-bold rounded-t-xl border-b-2">📏 文の区切り</button>
    <button onclick="switchTab('s')" id="tab-s" class="tabbtn px-5 py-2 text-sm font-bold rounded-t-xl border-b-2">🔊 文の強勢</button>
  </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-6">
  <div id="sec-k"></div>
  <div id="sec-s" class="hidden"></div>
</main>

<footer class="text-center text-xs text-slate-400 py-6 px-4 leading-relaxed">
  区切り＝教科書の正解（赤線）どおり。<br>強勢＝「新情報・対比・答えの中心を最も強く読む」ルールから判定。
</footer>

<script>
// ─────────── データ ───────────
// 区切り: chunks を " / " で区切って読む。answer = 何番目の区切りで1回切るか（1始まり）
const KUGIRI = [
  { title:'大問 1', items:[
    { chunks:["The boy","I saw","in the garden","was Mary's brother."], a:3, r:"「The boy I saw in the garden」が主語 → 述語 was の前で切る" },
    { chunks:["The girl","stopped singing","when she heard","a noise."], a:2, r:"「The girl stopped singing」で一区切り → 接続詞 when の前" },
    { chunks:["On my way","home","I met","my friend's mother."], a:2, r:"「On my way home（帰り道で）」のまとまりの後、主語 I の前" },
    { chunks:["He sent","me","a letter","while he was","traveling."], a:3, r:"「He sent me a letter」で文の骨組み → while の前" },
    { chunks:["The only way","to get","the concert ticket","is to make","a phone call."], a:3, r:"「The only way to get the concert ticket」が主語 → is の前" },
  ]},
  { title:'大問 2', items:[
    { chunks:["My mother told me","not","to be late for","school."], a:1, r:"「My mother told me」の後、伝えた内容 not… の前" },
    { chunks:["The man I saw","in front of my house","was looking","for something."], a:2, r:"「The man I saw in front of my house」が主語 → was の前" },
    { chunks:["I didn't know","what","to say to","her."], a:1, r:"「I didn't know」の後、疑問詞 what の前" },
    { chunks:["Both my sister","and my mother","are interested","in making","dresses."], a:2, r:"「Both my sister and my mother」が主語 → are の前" },
    { chunks:["It is important","that we read","as many","books","as possible."], a:1, r:"「It is important」の後、that 節の前" },
  ]},
  { title:'大問 3', items:[
    { chunks:["Do you know","where I can","walk","my dog?"], a:1, r:"「Do you know」の後、疑問詞 where の前" },
    { chunks:["The girl","wearing","a blue hat","carries a suitcase."], a:3, r:"「The girl wearing a blue hat」が主語 → carries の前" },
    { chunks:["What kind","of","sports","do you like?"], a:3, r:"「What kind of sports」のまとまりの後、do you like の前" },
    { chunks:["The boy","ran away","as soon as","he saw","me."], a:2, r:"「The boy ran away」で骨組み → as soon as の前" },
    { chunks:["My bicycle","stolen","near the station","was found","in another town."], a:3, r:"「My bicycle stolen near the station」が主語 → was found の前" },
  ]},
  { title:'大問 4（第70回）', items:[
    { chunks:["We weren't","able","to find a place","to play soccer."], a:3, r:"「We weren't able to find a place」の後、目的の to play の前" },
    { chunks:["The house","whose roof","is blue","is my uncle's."], a:3, r:"「The house whose roof is blue」が主語 → is my uncle's の前" },
    { chunks:["I got caught","in the rain","on my way","to school."], a:2, r:"「I got caught in the rain」で一区切り → on my way の前" },
    { chunks:["Nick told me","I looked hungry","and","gave me","his sandwiches."], a:2, r:"「Nick told me I looked hungry」の後、and の前" },
    { chunks:["A book","written","by the writer","about fifty years ago","is still very popular."], a:4, r:"「A book written by the writer about fifty years ago」が主語 → is の前" },
  ]},
  { title:'大問 5（第68回）', items:[
    { chunks:["Let's talk","about the plan","over a cup","of coffee."], a:2, r:"「Let's talk about the plan」の後、over a cup の前" },
    { chunks:["Could you show me","where I can buy","the ticket","to the concert?"], a:1, r:"「Could you show me」の後、疑問詞 where の前" },
    { chunks:["Students","who were absent","yesterday","must take the exams today."], a:3, r:"「Students who were absent yesterday」が主語 → must の前" },
    { chunks:["Mike arrived","at the theater","ten minutes","after the movie","started."], a:2, r:"「Mike arrived at the theater」で一区切り → ten minutes の前" },
    { chunks:["Whether the baseball","game","will be held","depends","on the weather."], a:3, r:"「Whether the baseball game will be held」が主語 → depends の前" },
  ]},
];

// 強勢: qa=Aの発言, b=Bの発言トークン[[text, num(0=普通/1-4=選択肢)]…], a=正解番号
const KYOUSEI = [
  { title:'大問 1', items:[
    { qa:"Do you know who the woman is?", b:[["Yes,",0],["she",1],["is",2],["my aunt",3],[".",0]], a:3, r:"質問の答え「おばだ」= my aunt が新情報" },
    { qa:"What time will the concert start?", b:[["I think",1],["it'll",2],["start at",0],["seven",3],[".",0]], a:3, r:"時刻を問われた答え「seven」が新情報" },
    { qa:"Who did you go to Hokkaido with?", b:[["I",0],["went",1],["there",2],["with",0],["Mary",3],[".",0]], a:3, r:"「だれと」の答え「Mary」が新情報" },
    { qa:"How far is it from here to the station?", b:[["It",1],["is",2],["about",3],["two kilometers",4],[".",0]], a:4, r:"距離の答え「two kilometers」が新情報" },
    { qa:"What will you do if you find some money on the road?", b:[["Of course",0],["I'll",1],["take",0],["it",2],["to",3],["the police",4],[".",0]], a:4, r:"「どうする」の答えの中心「the police（警察に届ける）」" },
  ]},
  { title:'大問 2', items:[
    { qa:"Why were you absent from school yesterday?", b:[["Because",0],["I",1],["had",2],["a",0],["cold",3],[".",0]], a:3, r:"欠席の理由「a cold（かぜ）」が新情報" },
    { qa:"Did you go to the U.S. with your family?", b:[["No,",0],["I",0],["went",1],["there",2],["alone",3],[".",0]], a:3, r:"「家族と?」に対し「alone（一人で）」という対比" },
    { qa:"Which is your mother in the picture?", b:[["She",1],["is the",0],["woman",2],["wearing a",0],["jacket",3],[".",0]], a:3, r:"見分ける手がかり「jacket を着た人」" },
    { qa:"Would you like another cup of coffee?", b:[["No, thank you.",0],["I'd",1],["rather",0],["have",2],["a",0],["glass",3],["of",0],["water",4],[".",0]], a:4, r:"コーヒーではなく「water」という対比" },
    { qa:"Who drove you home?", b:[["I met",0],["Bob",1],["on my way",0],["home",2],["and he",0],["gave",3],["me",0],["a ride",4],[".",0]], a:1, r:"「だれが」の答え「Bob」" },
  ]},
  { title:'大問 3（第68回）', items:[
    { qa:"How long are you going to stay in Hiroshima?", b:[["I'm",0],["planning",1],["to",0],["stay there",2],["for",0],["ten days",3],[".",0]], a:3, r:"期間の答え「ten days」が新情報" },
    { qa:"Do you know where Bob is?", b:[["He",1],["is",0],["doing his homework",2],["in the library",3],[".",0]], a:3, r:"「どこ」の答え「in the library」が新情報" },
    { qa:"Have you seen Judy play the guitar?", b:[["No, I have",0],["never",1],["seen",2],["her",0],["play",3],[".",0]], a:1, r:"「一度も~ない」の否定 never を強調" },
    { qa:"Why didn't you finish your math homework?", b:[["Because",1],["I had a terrible",0],["fever",2],["after dinner",3],["last night",4],[".",0]], a:2, r:"できなかった理由の核「fever（熱）」" },
    { qa:"What would you like to eat for lunch?", b:[["Anything",1],["is",0],["fine",2],["for me",3],[".",0],["I'm really",0],["hungry",4],[".",0]], a:1, r:"「何でもいい」= Anything が答えの中心" },
  ]},
  { title:'大問 4（第70回）', items:[
    { qa:"Does your father drive to work?", b:[["No, he",0],["usually",1],["takes",0],["the train",2],["to",0],["his office",3],[".",0]], a:2, r:"車ではなく「the train」という対比" },
    { qa:"Your daughter is studying at Zensho University, isn't she?", b:[["Well, in fact, she",0],["finished",1],["her studies",2],["this March",3],[".",0]], a:1, r:"まだ勉強中と思われたが「もう終えた finished」" },
    { qa:"How's your new part-time job at the supermarket?", b:[["A lot of people",1],["come to the store",0],["to buy food",2],[", so it's",0],["very exciting",3],[".",0]], a:3, r:"仕事の感想「very exciting」が中心" },
    { qa:"Why don't you write a speech about the history of Hiroshima?", b:[["That's",1],["a good idea",2],["because we'll",0],["soon",3],["go",0],["there",4],[".",0]], a:2, r:"提案への賛成「a good idea」" },
    { qa:"When did you start playing the piano for the first time?", b:[["I",0],["started",1],["practicing",2],["it with my",0],["brother",3],["when I was",0],["seven years old",4],[".",0]], a:4, r:"「いつ」の答え「seven years old」" },
  ]},
];

const CIRC = ['','①','②','③','④','⑤'];
const AB = ['a','b','c','d','e','f','g'];

// ─────────── 区切りカード ───────────
function kugiriSentence(chunks, ans, revealed){
  let html = '<span class="en">';
  chunks.forEach((c,i)=>{
    html += c.replace(/ /g,'&nbsp;');
    if(i < chunks.length-1){
      const n = i+1;
      const hit = revealed && n===ans ? ' hit' : '';
      html += `<span class="brk${hit}"><span class="slash">/</span><span class="num">${CIRC[n]}</span></span>`;
    }
  });
  html += '</span>';
  return html;
}

function renderKugiri(){
  const box = document.getElementById('sec-k');
  box.innerHTML = KUGIRI.map((g,gi)=>`
    <section class="mb-8">
      <h2 class="text-sm font-black text-slate-400 uppercase tracking-wider mb-3">${g.title}</h2>
      <div class="space-y-3">
        ${g.items.map((it,ii)=>{
          const id = `k-${gi}-${ii}`;
          return `
          <div class="qcard bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <button onclick="toggle('${id}')" class="w-full text-left px-4 py-3 hover:bg-slate-50 flex items-start gap-3">
              <span class="text-slate-400 font-black text-sm mt-1 w-4 shrink-0">${AB[ii]}.</span>
              <span class="text-lg sm:text-xl leading-relaxed" id="sent-${id}">${kugiriSentence(it.chunks, it.a, false)}</span>
            </button>
            <div class="reveal px-4 pb-3 pl-11" id="rev-${id}">
              <div class="bg-red-50 border border-red-100 rounded-lg px-3 py-2 text-sm">
                <span class="font-black text-red-600 text-base">答え ${CIRC[it.a]}</span>
                <span class="text-slate-600 ml-2">${it.r}</span>
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </section>
  `).join('');
}

// ─────────── 強勢カード ───────────
function kyouseiSentence(tokens, ans, revealed){
  const parts = tokens.map(([t,n])=>{
    const pad = /^[.,?!]/.test(t) ? '' : ' ';
    if(n===0) return pad + t.replace(/ /g,'&nbsp;');
    const hit = revealed && n===ans ? ' hit' : '';
    return `${pad}<span class="choice${hit}">${t.replace(/ /g,'&nbsp;')}<span class="num">${CIRC[n]}</span></span>`;
  });
  return '<span class="en">' + parts.join('') + '</span>';
}

function renderKyousei(){
  const box = document.getElementById('sec-s');
  box.innerHTML = KYOUSEI.map((g,gi)=>`
    <section class="mb-8">
      <h2 class="text-sm font-black text-slate-400 uppercase tracking-wider mb-3">${g.title}</h2>
      <div class="space-y-3">
        ${g.items.map((it,ii)=>{
          const id = `s-${gi}-${ii}`;
          return `
          <div class="qcard bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <button onclick="toggle('${id}')" class="w-full text-left px-4 py-3 hover:bg-slate-50">
              <div class="flex items-start gap-3">
                <span class="text-slate-400 font-black text-sm mt-0.5 w-4 shrink-0">${AB[ii]}.</span>
                <div class="flex-1">
                  <p class="text-sm text-slate-500 en mb-1">A : ${it.qa}</p>
                  <p class="text-lg sm:text-xl leading-relaxed">B : <span id="sent-${id}">${kyouseiSentence(it.b, it.a, false)}</span></p>
                </div>
              </div>
            </button>
            <div class="reveal px-4 pb-3 pl-11" id="rev-${id}">
              <div class="bg-amber-50 border border-amber-100 rounded-lg px-3 py-2 text-sm">
                <span class="font-black text-amber-600 text-base">答え ${CIRC[it.a]}</span>
                <span class="text-slate-600 ml-2">${it.r}</span>
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </section>
  `).join('');
}

// ─────────── 操作 ───────────
function findItem(id){
  const [type,gi,ii] = id.split('-');
  const src = type==='k' ? KUGIRI : KYOUSEI;
  return { type, it: src[+gi].items[+ii] };
}
function setRevealed(id, on){
  const rev = document.getElementById(`rev-${id}`);
  const sent = document.getElementById(`sent-${id}`);
  const {type,it} = findItem(id);
  rev.classList.toggle('show', on);
  if(type==='k') sent.innerHTML = kugiriSentence(it.chunks, it.a, on);
  else           sent.innerHTML = kyouseiSentence(it.b, it.a, on);
}
function toggle(id){
  const rev = document.getElementById(`rev-${id}`);
  setRevealed(id, !rev.classList.contains('show'));
}
function toggleAll(on){
  document.querySelectorAll('.reveal').forEach(r=>{
    setRevealed(r.id.replace('rev-',''), on);
  });
}

// ─────────── タブ ───────────
const TAB_ON  = 'border-blue-500 text-blue-700 bg-blue-50';
const TAB_OFF = 'border-transparent text-slate-500 bg-white hover:text-slate-700';
function switchTab(t){
  document.getElementById('sec-k').classList.toggle('hidden', t!=='k');
  document.getElementById('sec-s').classList.toggle('hidden', t!=='s');
  const base='tabbtn px-5 py-2 text-sm font-bold rounded-t-xl border-b-2 ';
  document.getElementById('tab-k').className = base + (t==='k'?TAB_ON:TAB_OFF);
  document.getElementById('tab-s').className = base + (t==='s'?TAB_ON:TAB_OFF);
}

renderKugiri();
renderKyousei();
switchTab('k');
</script>
</body>
</html>
