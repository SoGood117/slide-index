<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全商英語検定試験問題集 解答｜聞き方(3) 長文</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
  body { font-family:'Noto Sans JP', sans-serif; }
  .en { font-family:'Georgia','Times New Roman',serif; }
  .qcard { transition: box-shadow .15s ease; }
  .opt { transition: background .15s ease, border-color .15s ease; }
  .reveal { display:none; }
  .reveal.show { display:block; }
</style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

<header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
  <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
    <div>
      <p class="text-xs sm:text-sm font-bold text-indigo-500">🎓 全商英語検定試験問題集 解答</p>
      <h1 class="text-xl sm:text-2xl font-black">📖 聞き方(3) 長文 <span class="text-slate-400 font-bold text-base">答え合わせ</span></h1>
      <p class="text-xs text-slate-400 mt-0.5">本文と設問を読んで予想 → カードをタップすると正解が緑に光ります</p>
    </div>
    <div class="flex gap-2 shrink-0">
      <button onclick="toggleAll(true)"  class="bg-blue-500 hover:bg-blue-600 text-white text-xs sm:text-sm font-bold px-3 py-2 rounded-xl">全部表示</button>
      <button onclick="toggleAll(false)" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs sm:text-sm font-bold px-3 py-2 rounded-xl">全部隠す</button>
    </div>
  </div>
  <div class="max-w-4xl mx-auto px-4 pb-3 flex gap-1 overflow-x-auto" id="tabbar"></div>
</header>

<main class="max-w-4xl mx-auto px-4 py-6" id="main"></main>

<footer class="text-center text-xs text-slate-400 py-6 px-4 leading-relaxed">
  英文が読まれ、その内容についての5つの問いに①②③から答える問題です。緑＝正解。<br>
  ＝全商英語検定試験問題集（3級）実践演習 p.24〜25／CD A 58〜99・B 01〜14 準拠＝
</footer>

<script>
// ─────────── データ ───────────
// passage=読まれる英文 / items[ q=設問, opts=[①②③], a=正解番号, r=ポイント ]
const SETS = [
  { title:'実践演習 1', cd:'CD A 58〜71',
    passage:"Sara usually gets up at seven o'clock every morning, but she got up two hours earlier than usual yesterday morning. She planned to fly to Canada in the afternoon. She put a lot of warm clothes in her suitcase, because she heard it was very cold there. She went to the airport by bus and arrived there at three o'clock in the afternoon. When she opened her small bag to take out her passport, she found she didn't have the key to her suitcase. Then she called her parents and asked them to bring the key to her. Her father jumped into his car with the key. He drove so fast that he could get there in time for her plane. Sara was very happy, but her father was very tired.",
    items:[
      { q:"What time did Sara get up yesterday morning?", opts:["7 o'clock.","6 o'clock.","5 o'clock."], a:3, r:"いつもは7時。その2時間前 → 5時に起きた" },
      { q:"What country was Sara going to visit?", opts:["Canada.","The United States.","China."], a:1, r:"She planned to fly to Canada." },
      { q:"How did Sara get to the airport?", opts:["By plane.","By bus.","By taxi."], a:2, r:"She went to the airport by bus." },
      { q:"What did Sara find at the airport?", opts:["She lost her passport.","Her suitcase was broken.","She forgot to bring the key."], a:3, r:"スーツケースの鍵を持っていないと気づいた（＝鍵を忘れた）" },
      { q:"Who went to the airport to help Sara?", opts:["Her father","Her mother","Nobody"], a:1, r:"お父さんが鍵を持って車で駆けつけた" },
    ]},
  { title:'実践演習 2', cd:'CD A 72〜85',
    passage:"Yuki is a high school student in Tokyo. Last summer she went to Australia with her father and mother. When they arrived there, it was not summer. It was winter and very cold. In Australia, they went to many places. When Yuki visited a high school, some students were studying Japanese. They said they were interested in the Japanese language, Japanese 'anime', and many other things made in Japan. After staying for two weeks, Yuki and her parents returned to Japan. When they arrived at Narita Airport, it was very hot. They felt like going back to Australia.",
    items:[
      { q:"When did Yuki go to Australia?", opts:["Last summer.","Next summer.","Last spring."], a:1, r:"Last summer she went to Australia." },
      { q:"Who did Yuki go to Australia with?", opts:["Her brother.","Her uncle.","Her parents."], a:3, r:"with her father and mother（＝両親）" },
      { q:"When Yuki went to Australia, what season was it there?", opts:["Fall.","Winter.","Summer."], a:2, r:"It was winter and very cold.（南半球なので逆）" },
      { q:"What did the students studying Japanese say?", opts:["They said many Australian people speak Japanese.","They said they were interested in Japanese things.","They said they wanted to tell Japanese people about Australia."], a:2, r:"interested in the Japanese language, anime, and other things made in Japan" },
      { q:"How many days did Yuki stay in Australia?", opts:["For seven days.","For ten days.","For fourteen days."], a:3, r:"After staying for two weeks（＝14日間）" },
    ]},
  { title:'実践演習 3', cd:'CD A 86〜99',
    passage:"Julia's father was born on a farm in a small village. When he was young, he had many things to do. He used to wake up early. He gave the animals water and food, and he kept them healthy. His days on the farm were long, but his secret to success was working hard. Today, many young people don't work on farms. They work in offices with computers. Julia's father wants her to go to university, so she is studying farming there. She wants to help her father, and he is proud of her.",
    items:[
      { q:"Where was Julia's father born?", opts:["next to a computer company.","in a big city.","on a farm."], a:3, r:"born on a farm in a small village" },
      { q:"What did Julia's father do when he was young?", opts:["He woke up early, and he went to work in an office with a computer.","He woke up late, and he gave the animals water and food.","He gave the animals water and food, and he kept them healthy."], a:3, r:"gave the animals water and food, and kept them healthy" },
      { q:"For Julia's father, what was his secret to success?", opts:["studying hard.","working hard.","going to university."], a:2, r:"his secret to success was working hard" },
      { q:"What does Julia's father want Julia to do?", opts:["to work in an office.","to go to university.","to live in a small village."], a:2, r:"wants her to go to university" },
      { q:"What does Julia's father feel about his daughter?", opts:["He is proud of her.","He doesn't like her going to university.","He thinks she works too hard."], a:1, r:"he is proud of her" },
    ]},
  { title:'実践演習 4', cd:'CD B 01〜14',
    passage:"I'm Harry from London. I came to Japan two years ago. First, I lived in Fukuoka for a year, then moved to Osaka. Now I live there and go to high school. I'm planning to go to college in Tokyo and will study Japanese history. I have a sister named Cathy. She is a high school student in London. She is interested in science. She also wants to come to Japan to study it in the future. She keeps a diary in Japanese. She thinks it is a good way to learn Japanese.",
    items:[
      { q:"When did Harry come to Japan?", opts:["Two months ago.","Two years ago.","Three years ago."], a:2, r:"I came to Japan two years ago." },
      { q:"Where does Harry live now?", opts:["Tokyo.","Osaka.","Fukuoka."], a:2, r:"then moved to Osaka. Now I live there.（福岡→大阪）" },
      { q:"What kind of subject does Harry want to study in college?", opts:["Science.","English.","Japanese history."], a:3, r:"go to college in Tokyo and will study Japanese history" },
      { q:"Who is Cathy?", opts:["She is Harry's sister and goes to high school in London.","She is Harry's sister and goes to college in Tokyo.","She is a science teacher in Harry's high school."], a:1, r:"a sister named Cathy … a high school student in London" },
      { q:"How does Cathy study Japanese?", opts:["She studies science in Japan.","She talks with Harry in Japanese.","She writes her diary in Japanese."], a:3, r:"She keeps a diary in Japanese.（日本語で日記）" },
    ]},
];

const CIRC = ['','①','②','③','④','⑤'];
const AB   = ['a','b','c','d','e','f','g'];
let cur = 0;

// ─────────── タブ ───────────
const TAB_ON  = 'border-blue-500 text-blue-700 bg-blue-50';
const TAB_OFF = 'border-transparent text-slate-500 bg-white hover:text-slate-700';
function renderTabs(){
  document.getElementById('tabbar').innerHTML = SETS.map((s,i)=>
    `<button onclick="switchTab(${i})" id="tab-${i}"
       class="tabbtn shrink-0 px-4 py-2 text-sm font-bold rounded-t-xl border-b-2 ${i===cur?TAB_ON:TAB_OFF}">
       大問${i+1}</button>`).join('');
}
function switchTab(i){ cur=i; renderTabs(); renderMain(); }

// ─────────── 本体 ───────────
function renderMain(){
  const s = SETS[cur];
  document.getElementById('main').innerHTML = `
    <div class="flex items-center gap-2 mb-3">
      <span class="bg-indigo-600 text-white px-3 py-1 rounded-lg font-black text-sm">${s.title}</span>
      <span class="en text-xs font-bold text-slate-400">${s.cd}</span>
    </div>
    <div class="bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 mb-4">
      <p class="text-xs font-black text-amber-700 mb-1">📻 読まれる英文</p>
      <p class="en text-sm sm:text-base leading-relaxed text-slate-700">${s.passage}</p>
    </div>
    <div class="space-y-3">
      ${s.items.map((it,ii)=>{
        const id = `${cur}-${ii}`;
        const opts = it.opts.map((o,oi)=>{
          const n = oi+1;
          return `<div class="opt flex items-start gap-2 px-3 py-1.5 rounded-lg border border-transparent" id="opt-${id}-${n}">
                    <span class="font-black text-slate-400 shrink-0">${CIRC[n]}</span>
                    <span class="en text-sm sm:text-base">${o}</span>
                    <span class="ml-auto text-emerald-600 font-black opacity-0 shrink-0 whitespace-nowrap" id="chk-${id}-${n}">✓ 正解</span>
                  </div>`;
        }).join('');
        return `
        <div class="qcard bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
          <button onclick="toggle('${id}')" class="w-full text-left px-4 py-3 hover:bg-slate-50">
            <div class="flex items-start gap-3">
              <span class="text-slate-400 font-black text-sm mt-1 w-4 shrink-0">${AB[ii]}.</span>
              <div class="flex-1">
                <p class="text-base sm:text-lg leading-relaxed mb-2">
                  <span class="en font-black text-sky-600 mr-1">Q :</span><span class="en">${it.q}</span>
                </p>
                <div class="space-y-1">${opts}</div>
              </div>
              <span class="text-slate-300 text-xs mt-1 shrink-0" id="hint-${id}">タップで正解 ▾</span>
            </div>
          </button>
          <div class="reveal px-4 pb-3 pl-11" id="rev-${id}">
            <div class="bg-emerald-50 border border-emerald-100 rounded-lg px-3 py-2 text-sm flex items-start gap-2">
              <span class="font-black text-emerald-600 shrink-0">答え ${CIRC[it.a]}</span>
              <span class="text-slate-600 mt-0.5 en">${it.r}</span>
            </div>
          </div>`;
      }).join('')}
    </div>`;
}

// ─────────── 操作 ───────────
function setRevealed(id, on){
  const it = SETS[+id.split('-')[0]].items[+id.split('-')[1]];
  document.getElementById(`rev-${id}`).classList.toggle('show', on);
  const h = document.getElementById(`hint-${id}`);
  if(h) h.style.visibility = on ? 'hidden' : 'visible';
  const opt = document.getElementById(`opt-${id}-${it.a}`);
  const chk = document.getElementById(`chk-${id}-${it.a}`);
  if(opt){ opt.classList.toggle('bg-emerald-50', on); opt.classList.toggle('border-emerald-300', on); }
  if(chk){ chk.style.opacity = on ? '1' : '0'; }
}
function toggle(id){
  const on = !document.getElementById(`rev-${id}`).classList.contains('show');
  setRevealed(id, on);
}
function toggleAll(on){
  document.querySelectorAll('.reveal').forEach(r=> setRevealed(r.id.replace('rev-',''), on));
}

renderTabs();
renderMain();
</script>
</body>
</html>
