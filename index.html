<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スライド一覧 | SoGood</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
    body { font-family: 'Noto Sans JP', sans-serif; }
    .slide-card { transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .slide-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
    .tab-btn { transition: all 0.2s; flex-shrink: 0; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .tag-focus   { background:#fef9c3; color:#92400e; border:1px solid #fde68a; }
    .tag-section { background:#eff6ff; color:#1e40af; border:1px solid #bfdbfe; }
    .tag-ura     { background:#f0fdf4; color:#166534; border:1px solid #bbf7d0; }
    .tag-try     { background:#fdf4ff; color:#6b21a8; border:1px solid #e9d5ff; }
    .tag-ondoku  { background:#fff7ed; color:#9a3412; border:1px solid #fed7aa; }
    .spinner { border:3px solid #e5e7eb; border-top-color:#3b82f6; border-radius:50%; width:28px; height:28px; animation:spin 0.7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-10 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 pt-4 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-black text-gray-800">📚 授業スライド一覧</h1>
        <p id="last-updated" class="text-xs text-gray-400 mt-0.5">タブを選んで読み込み</p>
      </div>
      <button onclick="refreshCurrent()" id="refresh-btn"
        class="flex items-center gap-2 bg-blue-500 hover:bg-blue-600 text-white text-sm font-bold px-4 py-2 rounded-xl transition-colors">
        <span id="refresh-icon">🔄</span> 更新
      </button>
    </div>
    <!-- タブナビゲーション -->
    <div class="max-w-5xl mx-auto px-4 mt-3 flex gap-1 overflow-x-auto">
      <button onclick="switchTab('grade-1')"    id="tab-grade-1"    class="tab-btn px-5 py-2.5 text-sm font-bold rounded-t-xl border-b-2 whitespace-nowrap">📘 1年生</button>
      <button onclick="switchTab('grade-2')"    id="tab-grade-2"    class="tab-btn px-5 py-2.5 text-sm font-bold rounded-t-xl border-b-2 whitespace-nowrap">📗 2年生</button>
      <button onclick="switchTab('grade-3')"    id="tab-grade-3"    class="tab-btn px-5 py-2.5 text-sm font-bold rounded-t-xl border-b-2 whitespace-nowrap">📕 3年生</button>
      <button onclick="switchTab('grade-600')"  id="tab-grade-600"  class="tab-btn px-5 py-2.5 text-sm font-bold rounded-t-xl border-b-2 whitespace-nowrap">📙 600</button>
      <button onclick="switchTab('grade-misc')" id="tab-grade-misc" class="tab-btn px-5 py-2.5 text-sm font-bold rounded-t-xl border-b-2 whitespace-nowrap">📂 その他</button>
      <button onclick="switchTab('grade-timer')" id="tab-grade-timer" class="tab-btn px-5 py-2.5 text-sm font-bold rounded-t-xl border-b-2 whitespace-nowrap">⏱ タイマー</button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <div id="content-grade-1"    class="tab-content"></div>
    <div id="content-grade-2"    class="tab-content"></div>
    <div id="content-grade-3"    class="tab-content"></div>
    <div id="content-grade-600"  class="tab-content"></div>
    <div id="content-grade-misc" class="tab-content"></div>
    <div id="content-grade-timer" class="tab-content"></div>
  </main>

  <footer class="text-center text-xs text-gray-400 py-6">
    GitHubに新しいスライドをプッシュすると、「更新」ボタンを押すだけで自動反映されます
  </footer>

<script>
// ── 設定 ──────────────────────────────────────────────────────────
const REPOS = [
  { id:'grade-1', repo:'1nen-slides', label:'1年生', color:'blue',  icon:'📘', pageBase:'https://sogood117.github.io/1nen-slides/' },
  { id:'grade-2', repo:'2nen-slides', label:'2年生', color:'green', icon:'📗', pageBase:'https://sogood117.github.io/2nen-slides/' },
  { id:'grade-3', repo:'3nen-slides', label:'3年生', color:'red',   icon:'📕', pageBase:'https://sogood117.github.io/3nen-slides/' },
];

// 学年タブから除外するファイルのプレフィックス
function shouldExclude(name) {
  return ['karuta_','narabe_','pronouns_','600_','sample_sharing'].some(p => name.startsWith(p));
}

const ITEMS_600_KAISETSU = [
  { label:'600前置詞(1)(2)解説', sub:'前置詞（1）（2） ｜ 空所の日本語解説', url:'https://sogood117.github.io/1nen-slides/600_prepositions_answer.html', icon:'📝' },
  { label:'600不定詞(1)(2)解説', sub:'不定詞（1）（2） ｜ 重要語句の日本語解説', url:'https://sogood117.github.io/1nen-slides/600_futeishi12_answer.html', icon:'📝' },
  { label:'600口語表現(1)(2)解説', sub:'口語表現（1）（2） ｜ 重要語句の日本語解説', url:'https://sogood117.github.io/1nen-slides/600_kougo12_answer.html', icon:'📝' },
  { label:'600文型(3)・時制の基本 解説', sub:'文型（3）SVOC・時制の基本 ｜ 重要語句の日本語解説', url:'https://sogood117.github.io/1nen-slides/600_bunkei3_jisei_answer.html', icon:'📝' },
  { label:'600動名詞(1)(2)解説', sub:'動名詞（1）（2） ｜ 重要語句の日本語解説', url:'https://sogood117.github.io/1nen-slides/600_doumeishi12_answer.html', icon:'📝' },
];
const ITEMS_600_GAME = [
  { label:'英文かるた',           sub:'600文型② ｜ 日本語→英文',      url:'https://sogood117.github.io/1nen-slides/karuta_600bunkei2.html',       icon:'🎴' },
  { label:'英文かるた（後半探し）', sub:'600文型② ｜ 英文前半→後半',   url:'https://sogood117.github.io/1nen-slides/karuta_600bunkei2_split.html', icon:'🎴' },
  { label:'並べ替えクイズ',        sub:'600文型② ｜ 日本語→英文の語順', url:'https://sogood117.github.io/1nen-slides/narabe_600bunkei2.html',       icon:'🧩' },
  { label:'並べ替えクイズ',        sub:'600不定詞②③ ｜ 日本語→英文の語順', url:'https://sogood117.github.io/1nen-slides/narabe_600futeishi23.html',    icon:'🧩' },
];
// 全商英検３級（全商英語検定試験問題集の解答など）
const ITEMS_ZENSHO3 = [
  { label:'文の区切り・強勢 答え合わせ', sub:'②文の区切り(大問1-5)・③文の強勢(大問1-4) ｜ クリックで答え表示', url:'https://sogood117.github.io/slide-index/hatsuon_kugiri_kyousei_answer.html', icon:'🔊' },
  { label:'聞き方(1) 絵の説明 答え合わせ', sub:'実践演習1-4(CD A02-29) ｜ 対話文＋正解番号＋聞きとりのポイント', url:'https://sogood117.github.io/slide-index/e_no_setsumei_answer.html', icon:'🖼' },
  { label:'聞き方(2) 英問英答 答え合わせ', sub:'実践演習1-4(CD A30-57) ｜ ①②③を表示・タップで正解を緑ハイライト', url:'https://sogood117.github.io/slide-index/eimon_eito_answer.html', icon:'💬' },
  { label:'聞き方(3) 長文 答え合わせ', sub:'実践演習1-4(CD A58-99・B01-14) ｜ 本文＋設問＋①②③・タップで正解を緑ハイライト', url:'https://sogood117.github.io/slide-index/choubun_answer.html', icon:'📖' },
];
const ITEMS_MISC = [
  { label:'代名詞', sub:'Pronouns ｜ 主格 / 所有格 / 目的格 / 所有代名詞', url:'https://sogood117.github.io/1nen-slides/pronouns_table.html', icon:'📊' },
];
const ITEMS_TIMER = [
  { label:'TIMER', sub:'授業用カウントダウン ｜ 色変化＋ラスト10秒演出＋チャイム', url:'https://sogood117.github.io/slide-index/timer.html', icon:'⏱' },
];

const TAB_STYLES = {
  'grade-1':    { active:'border-blue-500   text-blue-700   bg-blue-50',   inactive:'border-transparent text-gray-500 bg-white hover:text-gray-700' },
  'grade-2':    { active:'border-green-500  text-green-700  bg-green-50',  inactive:'border-transparent text-gray-500 bg-white hover:text-gray-700' },
  'grade-3':    { active:'border-red-500    text-red-700    bg-red-50',    inactive:'border-transparent text-gray-500 bg-white hover:text-gray-700' },
  'grade-600':  { active:'border-orange-500 text-orange-700 bg-orange-50', inactive:'border-transparent text-gray-500 bg-white hover:text-gray-700' },
  'grade-misc': { active:'border-purple-500 text-purple-700 bg-purple-50', inactive:'border-transparent text-gray-500 bg-white hover:text-gray-700' },
  'grade-timer':{ active:'border-teal-500   text-teal-700   bg-teal-50',   inactive:'border-transparent text-gray-500 bg-white hover:text-gray-700' },
};
const HEADER_BG = {
  'grade-1':'bg-blue-600', 'grade-2':'bg-green-600', 'grade-3':'bg-red-600',
  'grade-600':'bg-orange-500', 'grade-misc':'bg-purple-600', 'grade-timer':'bg-teal-600',
};
const CARD_BORDER = { blue:'border-blue-200', green:'border-green-200', red:'border-red-200' };

// ── タブ切り替え ───────────────────────────────────────────────────
let currentTab = null;
const loadedTabs = new Set();

function switchTab(tabId) {
  if (currentTab === tabId) return;
  currentTab = tabId;

  Object.keys(TAB_STYLES).forEach(id => {
    const btn = document.getElementById(`tab-${id}`);
    const base = 'tab-btn px-5 py-2.5 text-sm font-bold rounded-t-xl border-b-2 whitespace-nowrap ';
    btn.className = base + (id === tabId ? TAB_STYLES[id].active : TAB_STYLES[id].inactive);
  });

  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.getElementById(`content-${tabId}`).classList.add('active');

  if (!loadedTabs.has(tabId)) loadTab(tabId);
}

async function loadTab(tabId) {
  loadedTabs.add(tabId);
  if (tabId === 'grade-600')   { render600();   return; }
  if (tabId === 'grade-misc')  { renderMisc();  return; }
  if (tabId === 'grade-timer') { renderTimer(); return; }

  const repo = REPOS.find(r => r.id === tabId);
  const container = document.getElementById(`content-${tabId}`);
  container.innerHTML = `<div class="flex items-center gap-3 text-gray-400 py-16 justify-center"><div class="spinner"></div><span class="text-sm">読み込み中...</span></div>`;

  try {
    const res = await fetch(`https://api.github.com/repos/SoGood117/${repo.repo}/contents/`, { headers:{'Accept':'application/vnd.github+json'} });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const files = (await res.json()).filter(f => !shouldExclude(f.name));
    renderGrade(container, repo, files);
    const now = new Date();
    document.getElementById('last-updated').textContent =
      `最終更新: ${now.toLocaleDateString('ja-JP')} ${now.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}`;
  } catch (e) {
    container.innerHTML = `<p class="text-sm text-red-500 bg-red-50 border border-red-200 rounded-xl px-4 py-3">⚠️ 取得できませんでした（${e.message}）</p>`;
  }
}

async function refreshCurrent() {
  if (!currentTab) return;
  loadedTabs.delete(currentTab);
  loadTab(currentTab);
}

// ── ファイル名パース ──────────────────────────────────────────────
function parseFileName(name) {
  const base = name.replace('.html','');
  let rest = base;
  if (/^\dS_/.test(base))     rest = base.replace(/^\dS_/,'');
  else if (/^\d_/.test(base)) rest = base.replace(/^\d_/,'');

  let ura='', tryLabel='', ondoku='';
  if (rest.endsWith('_ur'))     { ura='（裏面）';      rest=rest.replace(/_ur$/,''); }
  if (rest.endsWith('_Try'))    { tryLabel='（試）';    rest=rest.replace(/_Try$/,''); }
  if (rest.endsWith('_ondoku')) { ondoku='（音読シート）'; rest=rest.replace(/_ondoku$/,''); }

  const match = rest.match(/^L(\d+)(?:_(S(\d+)|Focus|Focus_Try))?/);
  if (!match) return { label:base, tag:'other' };

  const lesson=`L${match[1]}`, section=match[2];
  let sectionLabel='', tag='section';
  if (!section) { sectionLabel=''; tag='section'; }
  else if (section==='Focus'||section==='Focus_Try') { sectionLabel=' Focus'; tag='focus'; }
  else if (match[3]) { sectionLabel=` Section ${match[3]}`; tag='section'; }
  if (ura)      tag='ura';
  if (tryLabel) tag='try';
  if (ondoku)   tag='ondoku';

  const sectionNum = ondoku ? 200 : (section === 'Focus') ? 100 : match[3] ? parseInt(match[3]) : 0;
  return { label:`${lesson}${sectionLabel}${ura}${tryLabel}${ondoku}`, lesson:parseInt(match[1]), tag, sectionNum };
}

function tagBadge(tag) {
  const map = { focus:{cls:'tag-focus',text:'Focus'}, section:{cls:'tag-section',text:'Section'}, ura:{cls:'tag-ura',text:'裏面'}, try:{cls:'tag-try',text:'Try'}, ondoku:{cls:'tag-ondoku',text:'音読'} };
  const t = map[tag]||{cls:'tag-section',text:''};
  return `<span class="text-xs font-bold px-2 py-0.5 rounded-full ${t.cls}">${t.text}</span>`;
}

function groupByLesson(files) {
  const groups={};
  files.forEach(f => {
    if (!f.name.endsWith('.html')) return;
    const parsed=parseFileName(f.name);
    const key = parsed.lesson!=null ? `L${parsed.lesson}` : 'その他';
    if (!groups[key]) groups[key]={lesson:parsed.lesson??999,files:[]};
    groups[key].files.push({...f,parsed});
  });
  const variantRank = tag => ({try:1, ondoku:2, ura:3}[tag] ?? 0);
  return Object.entries(groups)
    .sort((a,b) => a[1].lesson - b[1].lesson)
    .map(([key,val]) => {
      val.files.sort((a,b) => {
        const sA = a.parsed.sectionNum ?? 99, sB = b.parsed.sectionNum ?? 99;
        if (sA !== sB) return sA - sB;
        return variantRank(a.parsed.tag) - variantRank(b.parsed.tag);
      });
      return {key,...val};
    });
}

function renderGrade(container, repo, files) {
  const border = CARD_BORDER[repo.color]||'border-gray-200';
  const groups = groupByLesson(files);
  const lessonHTML = groups.map(g=>`
    <div>
      <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">${g.key}</h3>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        ${g.files.map(f=>`
          <a href="${repo.pageBase}${f.name}" target="_blank" rel="noopener"
            class="slide-card bg-white rounded-xl border ${border} p-4 flex items-center justify-between gap-3 no-underline">
            <div class="flex items-center gap-3">
              <div class="text-2xl">${{focus:'🎯',ura:'🔄',ondoku:'🗣️'}[f.parsed.tag]||'▶️'}</div>
              <div>
                <p class="font-bold text-gray-800 text-sm leading-tight">${f.parsed.label}</p>
                <p class="text-xs text-gray-400 mt-0.5">${f.name}</p>
              </div>
            </div>
            ${tagBadge(f.parsed.tag)}
          </a>
        `).join('')}
      </div>
    </div>
  `).join('');

  container.innerHTML = `
    <div class="flex items-center gap-3 mb-6">
      <div class="flex items-center gap-2 ${HEADER_BG[repo.id]} text-white px-4 py-2 rounded-xl font-black text-lg shadow">
        ${repo.icon} ${repo.label}
      </div>
      <span class="text-sm text-gray-400">${files.filter(f=>f.name.endsWith('.html')).length} スライド</span>
    </div>
    <div class="space-y-6">${lessonHTML}</div>
  `;
}

// ── 600タブ ───────────────────────────────────────────────────────
function render600() {
  const container = document.getElementById('content-grade-600');
  const kaisetsuHTML = ITEMS_600_KAISETSU.map(item=>staticCard(item,'border-orange-200','bg-orange-100 text-orange-700 border border-orange-200','解説')).join('');
  const gameHTML     = ITEMS_600_GAME.map(item=>staticCard(item,'border-purple-200','bg-purple-100 text-purple-700 border border-purple-200','ゲーム')).join('');

  container.innerHTML = `
    <div class="space-y-8">
      <div>
        <div class="flex items-center gap-3 mb-4">
          <div class="flex items-center gap-2 bg-orange-500 text-white px-4 py-2 rounded-xl font-black text-lg shadow">📝 600解説</div>
          <span class="text-sm text-gray-400">${ITEMS_600_KAISETSU.length} アイテム</span>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${kaisetsuHTML}</div>
      </div>
      <div>
        <div class="flex items-center gap-3 mb-4">
          <div class="flex items-center gap-2 bg-purple-600 text-white px-4 py-2 rounded-xl font-black text-lg shadow">🎮 600ゲーム</div>
          <span class="text-sm text-gray-400">${ITEMS_600_GAME.length} アイテム</span>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${gameHTML}</div>
      </div>
    </div>
  `;
}

// ── その他タブ ────────────────────────────────────────────────────
function renderMisc() {
  const container = document.getElementById('content-grade-misc');
  const zensho3HTML = ITEMS_ZENSHO3.map(item=>staticCard(item,'border-indigo-200','bg-indigo-100 text-indigo-700 border border-indigo-200','全商英検3級')).join('');
  const miscHTML    = ITEMS_MISC.map(item=>staticCard(item,'border-purple-200','bg-purple-100 text-purple-700 border border-purple-200','参考')).join('');
  container.innerHTML = `
    <div class="space-y-8">
      <div>
        <div class="flex items-center gap-3 mb-4">
          <div class="flex items-center gap-2 bg-indigo-600 text-white px-4 py-2 rounded-xl font-black text-lg shadow">🎓 全商英検３級</div>
          <span class="text-sm text-gray-400">${ITEMS_ZENSHO3.length} アイテム</span>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${zensho3HTML}</div>
      </div>
      <div>
        <div class="flex items-center gap-3 mb-4">
          <div class="flex items-center gap-2 bg-purple-600 text-white px-4 py-2 rounded-xl font-black text-lg shadow">📊 参考</div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${miscHTML}</div>
      </div>
    </div>
  `;
}

// ── タイマータブ ──────────────────────────────────────────────────
function renderTimer() {
  const container = document.getElementById('content-grade-timer');
  const cards = ITEMS_TIMER.map(item=>staticCard(item,'border-teal-200','bg-teal-100 text-teal-700 border border-teal-200','ツール')).join('');
  container.innerHTML = `
    <div class="flex items-center gap-3 mb-6">
      <div class="flex items-center gap-2 bg-teal-600 text-white px-4 py-2 rounded-xl font-black text-lg shadow">⏱ タイマー</div>
      <span class="text-sm text-gray-400">${ITEMS_TIMER.length} アイテム</span>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${cards}</div>
  `;
}

function staticCard(item, borderCls, tagCls, tagText) {
  return `
    <a href="${item.url}" target="_blank" rel="noopener"
      class="slide-card bg-white rounded-xl border ${borderCls} p-4 flex items-center justify-between gap-3 no-underline">
      <div class="flex items-center gap-3">
        <div class="text-2xl">${item.icon}</div>
        <div>
          <p class="font-bold text-gray-800 text-sm leading-tight">${item.label}</p>
          <p class="text-xs text-gray-400 mt-0.5">${item.sub}</p>
        </div>
      </div>
      <span class="text-xs font-bold px-2 py-0.5 rounded-full whitespace-nowrap ${tagCls}">${tagText}</span>
    </a>
  `;
}

// ── 初期化 ────────────────────────────────────────────────────────
switchTab('grade-1');
</script>
</body>
</html>
